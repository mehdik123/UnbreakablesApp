<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0f" />
    <title>Unbreakables — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05060a;
        color: #e2e8f0;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      img { width: 96px; margin-bottom: 16px; opacity: 0.9; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { color: #94a3b8; margin: 0; max-width: 320px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <div>
      <img src="/brand-logo-light.png" alt="Unbreakables" />
      <h1>You&apos;re offline</h1>
      <p>Open the app from your home screen. If you logged in before, your program should still be available.</p>
      <p style="margin-top:16px"><button type="button" id="retry" style="background:#ff2d55;color:#fff;border:none;padding:10px 20px;border-radius:10px;font-weight:600;cursor:pointer">Try again</button></p>
    </div>
    <script>
      document.getElementById('retry').onclick = function () { location.reload(); };
      if ('caches' in window) {
        caches.match('/index.html').then(function (r) {
          if (r) location.replace(location.pathname + location.search || '/');
        });
      }
    </script>
  </body>
</html>
